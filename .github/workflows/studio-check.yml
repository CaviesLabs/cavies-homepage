name: Check Cavies Studio
on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-check.yml'
  push:
    branches: ['codex/cavies-studio']
    paths:
      - 'studio/**'
      - '.github/workflows/studio-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
